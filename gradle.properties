org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9.x 호환성 모드. 이 두 플래그를 빼면 빌드가 실패했다.
#
# 근거 갱신 필요 (2026-09-01): 원래 주석은 사유를 "Hilt 2.59.2가 새 DSL 미지원" 이라 적었는데
# 현재 Hilt 는 2.60.1 이다(`libs.versions.toml` 실측). 즉 **적힌 사유는 이미 낡았고**, 플래그를
# 지금 켤 수 있는지는 검증하지 않았다 — 끄고 빌드해봐야 확정된다.
# 낡은 사유를 그대로 두면 다음 사람이 "Hilt 때문" 이라는 틀린 전제로 판단하므로 여기 명시한다.
# 후속 대상: `docs/plans/logs/dependencies.md` 2026-09-01 entry 의 "잔여".
android.builtInKotlin=false
android.newDsl=false
android.defaults.buildfeatures.resvalues=true
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
