org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.dependency.useConstraints=true

# ── AGP 9 호환 opt-out (AGP 10 에서 제거 예정) ─────────────────────────────────
#
# 2026-09-02 재조사: 예전 주석은 사유를 "Hilt 2.59.2 가 새 DSL 미지원" 이라 적었는데
# **그건 틀렸다.** 실제로 끄고 빌드해서 확인한 원인은 다음 두 줄이다.
#
#   builtInKotlin 제거 → "The 'org.jetbrains.kotlin.android' plugin is no longer required
#                         for Kotlin support since AGP 9.0. Solution: Remove the plugin."
#   newDsl 만 제거     → "The 'org.jetbrains.kotlin.android' plugin is not compatible with
#                         AGP's 9.0 new DSL."  (ClassCastException: BaseExtension)
#
# 즉 두 플래그는 결합돼 있고, 막는 것은 Hilt 가 아니라 **KGP 의 kotlin.android 플러그인**이다.
# 해법은 기다리기가 아니라 플러그인을 지우고 AGP 내장 Kotlin 으로 넘어가는 것이다.
#
# 전환을 실제로 해봤고 컴파일까지는 통과한다 — 필요한 코드 변경은 딱 한 줄이다:
#   app/build.gradle.kts 의 generated OpenAPI 등록을 `java.srcDir` → `kotlin.srcDir`
#   (내장 Kotlin 은 java/kotlin 소스셋이 분리돼 java.srcDir 을 Kotlin 컴파일이 못 본다)
#
# **막히는 지점은 detekt 다.** detekt 1.23.8 의 Android 연동이 레거시 variant API 위에 있어
# 새 DSL 에서는 `detektDebug`/`detektBaselineDebug` 가 아예 등록되지 않는다(실측: `detekt`,
# `detektBaseline`, `detektGenerateConfig` 3개만 남음). 남은 평범한 `detekt` 태스크는 타입
# 해석 classpath 를 받지 못하므로 갈아타면 일부 룰이 **조용히** 검사를 멈춘다 — 게이트는
# green 인 채 품질만 내려간다. 의존처도 4곳이다(.githooks/pre-commit, android.yml,
# preflight-release.sh, config/detekt/detekt.yml 의 generated 제외 전제).
#
# 해제 조건: **detekt 2.0.0 정식 릴리스** (AGP 9 새 DSL 지원 = 2.0.0 마일스톤, issue #8981).
# MEASURED 2026-09-02 — Plugin Portal · Maven Central 모두 <release>1.23.8</release> 이고
# 2.x 는 alpha 뿐. 이 저장소는 프리릴리스를 채택하지 않는다(Kotlin 2.4.20-RC2 도 같은 이유로 보류).
#
# 상세: docs/plans/logs/process-infra.md (옛 페어 2026-09-02-full-audit-refactor-design.md §4 흡수)
android.builtInKotlin=false
android.newDsl=false

# 아래 4개는 2026-09-02 에 제거했다(전부 AGP 9 기본값으로 복귀, 게이트 + R8 릴리스 green):
#   enableAppCompileTimeRClass      — R 필드를 상수 문맥(when 등)에서 쓰는 코드 0건
#   usesSdkInManifest.disallowed    — 매니페스트에 <uses-sdk> 없음
#   defaults.buildfeatures.resvalues — resValue 사용 0건
#   r8.optimizedResourceShrinking   — 공식 문서상 enforced. 실측 APK −153 KB, 앱 리소스 손실 0
