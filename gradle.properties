org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 기본 built-in Kotlin + 새 DSL 사용. AGP 10에서 삭제되는 opt-out은 2026-10-15 제거했다.
# detekt 1.23.8의 레거시 Android variant 연동은 app/build.gradle.kts의 타입 해석 사용자 정의
# detektDebug/detektBaselineDebug 태스크로 대체한다.

# 아래 6개는 AGP 9 기본값으로 복귀했다(게이트 + R8 릴리스 검증):
#   enableAppCompileTimeRClass      — R 필드를 상수 문맥(when 등)에서 쓰는 코드 0건
#   usesSdkInManifest.disallowed    — 매니페스트에 <uses-sdk> 없음
#   defaults.buildfeatures.resvalues — resValue 사용 0건
#   r8.optimizedResourceShrinking   — 공식 문서상 enforced. 실측 APK −153 KB, 앱 리소스 손실 0
#   uniquePackageNames              — 단일 앱 모듈이며 AGP 9 마이그레이션 후 호환 플래그 불필요
#   dependency.useConstraints       — AGP 9 기본 false; 불필요한 library constraint/import 비용 제거
