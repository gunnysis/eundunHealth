services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eundunhealth
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:devpass@db:5432/eundunhealth
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-placeholder}
      SENTRY_DSN: ""
      ENVIRONMENT: development
    depends_on:
      - db
    volumes:
      - ./app:/app/app  # 핫 리로드용
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

volumes:
  pgdata:
