[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "D"]
ignore = [
    "N818",         # AppException 네이밍 유지 (기존)
    "D100", "D104", # 모듈/패키지 헤더 docstring 의무 X — 모듈 헤더 주석 스타일 유지
    "D107",         # __init__ docstring 의무 X — 클래스 docstring 으로 대체
    "D203", "D213", # convention="pep257" 와 redundant 하지만 의도 명확화 위해 명시
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]              # test 이름이 spec — 48건 제외
# auto-generated 디렉토리는 D 외 lint 룰 (UP/I/N) 도 보일러플레이트로 위반 가능 — 모두 검토 후 ignore.
# 학습 사례: PR #68 alembic init 의 UP007/UP035/I001 16건 (lesson L4).
"alembic/**" = ["D", "UP", "I"]  # auto-generated — D + UP007/UP035/I001 (alembic init 보일러플레이트) 제외
"app/main.py" = ["D"]            # FastAPI 앱 인스턴스
"app/schemas/**" = ["D101"]      # Pydantic schema — Field(description=) 대체, 7건 제외
"app/models/**" = ["D101"]       # SQLAlchemy ORM table — 3건 제외

[tool.coverage.run]
# 측정 코어 고정 — Python 3.12+ 의 기본 코어(ctrace, sys.settrace 기반)는 코루틴이
# await 에서 재개된 "직후 라인"을 체계적으로 놓쳐 async 코드 커버리지를 과소측정한다.
# 실측(2026-06-18): 기본 코어 87% vs sysmon 96% — 거짓 미커버 65줄이 전부 router/service 의
# await 다음 줄(예: weekly_plan router `return {"status":"ok"}`, service `raise NotFound`).
# 거짓 미커버가 진짜 갭을 노이즈로 가려 Codecov 신호를 왜곡했다. PEP 669 sys.monitoring
# 기반 sysmon 코어가 정확히 추적한다. branch coverage(`--cov-branch`)·dynamic context·
# 특수 concurrency 미사용이라 sysmon 제약(공식 문서 coverage 7.14 [run].core)에 해당 없음.
core = "sysmon"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Pydantic 2.13: alias_generator + populate_by_name 조합이 union/type-alias 필드에서
    # alias/validation_alias/serialization_alias가 "no effect"라고 경고하지만,
    # 실제 직렬화 동작은 정상(camelCase JSON in/out 테스트로 검증됨).
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning",
]
