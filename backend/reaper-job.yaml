# Container Apps Job spec - input for `az containerapp job create --yaml` (see scripts/setup-reaper-job.sh).
# `__SUBSCRIPTION_ID__` is rendered at provisioning time from `az account show --query id`
# (public repo: no subscription GUID committed). Keep comments ASCII-only (cp949 locale codec).
location: koreacentral
identity:
  type: UserAssigned
  userAssignedIdentities:
    "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper": {}
properties:
  environmentId: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.App/managedEnvironments/eundunhealth-env"
  configuration:
    triggerType: Schedule
    replicaTimeout: 1800
    replicaRetryLimit: 1
    scheduleTriggerConfig:
      cronExpression: "0 18 * * 0"
      parallelism: 1
      replicaCompletionCount: 1
    registries:
      - server: eundunhealthacr.azurecr.io
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
    secrets:
      - name: database-url
        keyVaultUrl: "https://kv-eundunhealth.vault.azure.net/secrets/database-url"
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
      - name: entra-tenant-id
        keyVaultUrl: "https://kv-eundunhealth.vault.azure.net/secrets/entra-tenant-id"
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
      - name: entra-subdomain
        keyVaultUrl: "https://kv-eundunhealth.vault.azure.net/secrets/entra-subdomain"
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
      - name: entra-backend-client-id
        keyVaultUrl: "https://kv-eundunhealth.vault.azure.net/secrets/entra-backend-client-id"
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
      - name: entra-backend-client-secret
        keyVaultUrl: "https://kv-eundunhealth.vault.azure.net/secrets/entra-backend-client-secret"
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
  template:
    containers:
      # CI (backend.yml) and scripts/setup-reaper-job.sh substitute `__IMAGE__` with the
      # image just deployed to the Container App, so app and job always share one image.
      # A hardcoded tag used to live here; it drifted and became a purge target (design D1).
      - image: __IMAGE__
        name: reaper
        command:
          - python
        args:
          - scripts/reap_orphaned_accounts.py
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: ENVIRONMENT
            value: production
          - name: DATABASE_URL
            secretRef: database-url
          - name: ENTRA_TENANT_ID
            secretRef: entra-tenant-id
          - name: ENTRA_SUBDOMAIN
            secretRef: entra-subdomain
          - name: ENTRA_BACKEND_CLIENT_ID
            secretRef: entra-backend-client-id
          - name: ENTRA_BACKEND_CLIENT_SECRET
            secretRef: entra-backend-client-secret
