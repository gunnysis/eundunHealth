# Container Apps Job spec - input for `az containerapp job create --yaml` (see scripts/setup-reaper-job.sh).
# `__SUBSCRIPTION_ID__` is rendered at provisioning time from `az account show --query id`
# (public repo: no subscription GUID committed). Keep comments ASCII-only (cp949 locale codec).
location: koreacentral
identity:
  type: UserAssigned
  userAssignedIdentities:
    "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper": {}
properties:
  environmentId: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.App/managedEnvironments/eundunhealth-env"
  configuration:
    triggerType: Schedule
    replicaTimeout: 1800
    replicaRetryLimit: 1
    scheduleTriggerConfig:
      cronExpression: "0 18 * * 0"
      parallelism: 1
      replicaCompletionCount: 1
    registries:
      - server: eundunhealthacr.azurecr.io
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
    secrets:
      - name: database-url
        keyVaultUrl: "https://kv-eundunhealth.vault.azure.net/secrets/database-url"
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
      - name: supabase-url
        keyVaultUrl: "https://kv-eundunhealth.vault.azure.net/secrets/supabase-url"
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
      - name: supabase-service-role-key
        keyVaultUrl: "https://kv-eundunhealth.vault.azure.net/secrets/supabase-service-role-key"
        identity: "/subscriptions/__SUBSCRIPTION_ID__/resourceGroups/rg-eundunhealth-prod-krc/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-eundunhealth-reaper"
  template:
    containers:
      - image: eundunhealthacr.azurecr.io/eundunhealth-api:0e6a99d
        name: reaper
        command:
          - python
        args:
          - scripts/reap_orphaned_accounts.py
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: ENVIRONMENT
            value: production
          - name: DATABASE_URL
            secretRef: database-url
          - name: SUPABASE_URL
            secretRef: supabase-url
          - name: SUPABASE_SERVICE_ROLE_KEY
            secretRef: supabase-service-role-key
