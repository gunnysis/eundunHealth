version: 2
updates:
  # Backend (Python / FastAPI) — production + dev
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: "chore(backend)"
    groups:
      # 보안 패치는 단일 PR로 모아 빠르게 리뷰
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      # 일반 마이너/패치도 묶어서 PR 노이즈 감소
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Pinned base-image digests are part of the backend supply chain and need
  # independent review from Python library upgrades.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 3
    labels: [dependencies, docker, backend]
    commit-message:
      prefix: "chore(docker)"

  # GitHub Actions — 단일 그룹으로 묶어 워크플로 파일 충돌 및 PR 파편화 방지 (룰 16)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      ci-actions:
        patterns: ["*"]

  # Android root (Gradle version catalog 포함)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, android]
    commit-message:
      prefix: "chore(android)"
    groups:
      androidx:
        patterns: ["androidx.*"]
      compose:
        patterns: ["androidx.compose*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      gradle-plugins-and-libs:
        applies-to: version-updates
        update-types: [minor, patch]
        exclude-patterns:
          - "androidx.*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
