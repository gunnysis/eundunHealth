name: Warm baseline check

# Container App minReplicas 가 1 미만(scale-to-zero 회귀)으로 떨어지지 않았는지 주기 확인.
# scale-to-zero 는 metric 미emit → Azure Monitor alert 사각지대(operations-snapshot §10).
# 실패 시 GitHub 가 기본적으로 워크플로 실패 알림(이메일)을 저장소 소유자에게 보낸다 = 무료 alert.
on:
  schedule:
    - cron: '17 0 * * *'   # 매일 1회 (UTC 00:17 = KST 09:17)
  workflow_dispatch:

# OIDC 연합(P2 1단계) — 장수명 SP secret(AZURE_CREDENTIALS) 대신 단기 토큰 로그인.
# federated credential subject = repo:gunnysis/eundunHealth:ref:refs/heads/main (schedule/dispatch 는 main ref).
# 설계: docs/plans/logs/process-infra.md (옛 페어 2026-06-29-cicd-recommended-design.md §5.4), 롤백 = creds 방식 revert(D7).
permissions:
  contents: read
  id-token: write   # OIDC 토큰 발급

jobs:
  check:
    name: Container App minReplicas >= 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure containerapp extension
        run: az extension add --name containerapp --only-show-errors || true

      - name: Check warm baseline (minReplicas)
        run: bash scripts/check-warm-baseline.sh
        env:
          CONTAINER_APP_NAME: eundunhealth-api
          RESOURCE_GROUP: rg-eundunhealth-prod-krc
