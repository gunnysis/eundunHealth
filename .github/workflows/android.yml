name: Android CI

# PR 반복 push 시 이전 실행 자동취소 — superseded 실행의 러너 점유 제거 + 피드백 속도 개선.
# main push 는 cancel-in-progress=false 로 보존.
# 설계: docs/plans/logs/process-infra.md (옛 페어 2026-06-29-cicd-recommended-design.md §3.1 P1 흡수)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'wear/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      # `gradle/**` 는 디렉터리 gradle/ 만 매칭한다 — 루트의 gradle.properties 는 안 걸린다.
      # AGP 호환 플래그·JVM 힙이 여기 있으므로 빠지면 빌드 설정 변경이 CI 를 통째로 우회한다
      # (2026-09-02 실측 구멍). version.properties 는 versionCode/Name 의 SSoT 이고,
      # gradlew 는 과거 CRLF 로 실제 사고가 났던 파일이다(INC 2026-06-19).
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'config/detekt/**'
      - 'scripts/check-agp10-compat.sh'
      - 'scripts/check-version-monotonic.sh'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'wear/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'config/detekt/**'
      - 'scripts/check-agp10-compat.sh'
      - 'scripts/check-version-monotonic.sh'
      - '.github/workflows/android.yml'

jobs:
  check:
    name: Lint, Detekt, Test, Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Create stub local.properties
        # BuildConfig 필드는 빌드 시 기본값으로 처리되어도 무방.
        # 서명용 RELEASE_* 도 debug 빌드와 unit test, lint에는 필요 없음.
        run: |
          cat > local.properties <<'EOF'
          BACKEND_BASE_URL=http://10.0.2.2:8080/
          SENTRY_DSN=
          EOF

      - name: Check AGP 10 compatibility & 3-module invariants
        run: |
          bash scripts/check-agp10-compat.sh
          bash scripts/check-version-monotonic.sh --check-ssot

      - name: Check collectAsState anti-pattern
        run: |
          echo "Checking for banned collectAsState() usage in :app and :wear..."
          FAIL=0
          # 1) Import 검사 — collectAsState 단독 import ($ anchor: collectAsStateWithLifecycle 제외)
          if grep -rn 'import androidx.compose.runtime.collectAsState$' app/src/main/java/ wear/src/main/java/; then
            echo "::error::Found banned 'import collectAsState'. Use collectAsStateWithLifecycle instead."
            FAIL=1
          fi
          # 2) 호출부 검사 — .collectAsState( 호출 (collectAsStateWithLifecycle 제외)
          if grep -rn '\.collectAsState(' app/src/main/java/ wear/src/main/java/ | grep -v 'collectAsStateWithLifecycle('; then
            echo "::error::Found banned '.collectAsState()' call. Use collectAsStateWithLifecycle instead."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "No collectAsState anti-pattern found."

      # 단일 Gradle 호출로 통합 — 5회 분리 호출 시 힙 압박 및 :app:packageDebug IncrementalSplitterRunnable
      # 레이스 위험을 제거하고 러너 실행 시간을 단축한다 (repository-gate.yml 과 동일 패턴).
      # 이 저장소의 릴리스 사고는 전부 R8 에서만 재현됐다 — 룰 12(2026-06-15 빈 운동계획,
      # Gson 래퍼 keep 누락)·INC-2026-07-02-29 회귀 가드(:app:assembleRelease :wear:assembleRelease) 포함.
      - name: Run 3-module quality gates & builds (:core:wear-contract, :app, :wear)
        run: |
          ./gradlew \
            :core:wear-contract:spotlessCheck :app:spotlessCheck :wear:spotlessCheck \
            :core:wear-contract:detektMain :app:detektDebug :wear:detektDebug \
            :core:wear-contract:test :app:testDebugUnitTest :wear:testDebugUnitTest \
            :app:assembleDebug :wear:assembleDebug \
            :app:assembleRelease :wear:assembleRelease

      - name: Upload debug APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: app-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 7
