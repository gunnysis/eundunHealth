name: Android CI

# PR 반복 push 시 이전 실행 자동취소 — superseded 실행의 러너 점유 제거 + 피드백 속도 개선.
# main push 는 cancel-in-progress=false 로 보존. 설계: docs/plans/2026-06-29-cicd-recommended-design.md §3.1 (P1)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'config/detekt/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'config/detekt/**'
      - '.github/workflows/android.yml'

jobs:
  check:
    name: Lint, Detekt, Test, Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create stub local.properties
        # BuildConfig 필드(SUPABASE_URL 등)는 빌드 시 빈 문자열로 처리되어도 무방.
        # 서명용 RELEASE_* 도 debug 빌드와 unit test, lint에는 필요 없음.
        run: |
          cat > local.properties <<'EOF'
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder
          BACKEND_BASE_URL=http://10.0.2.2:8080/
          SENTRY_DSN=
          EOF

      - name: Spotless check
        run: ./gradlew :app:spotlessCheck

      - name: Check collectAsState anti-pattern
        run: |
          echo "Checking for banned collectAsState() usage..."
          FAIL=0
          # 1) Import 검사 — collectAsState 단독 import ($ anchor: collectAsStateWithLifecycle 제외)
          if grep -rn 'import androidx.compose.runtime.collectAsState$' app/src/main/java/; then
            echo "::error::Found banned 'import collectAsState'. Use collectAsStateWithLifecycle instead."
            FAIL=1
          fi
          # 2) 호출부 검사 — .collectAsState( 호출 (collectAsStateWithLifecycle 제외)
          if grep -rn '\.collectAsState(' app/src/main/java/ | grep -v 'collectAsStateWithLifecycle('; then
            echo "::error::Found banned '.collectAsState()' call. Use collectAsStateWithLifecycle instead."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "No collectAsState anti-pattern found."

      - name: Detekt
        run: ./gradlew :app:detektDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      # NOTE: assembleDebug 는 R8 미적용 → 실제 R8 stripping(룰 12, Gson keep 갭/INC-2026-06-15-25)은
      # CI 에서 실행되지 않는다. Rule 12 가드는 위 Unit tests 의 ProguardKeepRulesTest(keep 규칙 박제) +
      # 출시 빌드 실기기 계측(룰 2/12, preflight-release.sh)으로 분담한다. 릴리스 빌드는 서명 키가
      # 필요해 CI 에 포함하지 않는다.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
