name: docs-plans-index

# 본 workflow 는 docs/plans/ frontmatter ↔ docs/plans/README.md drift 만 차단한다.
# backend.yml / android.yml 과 paths 가 disjoint — backend/android dev 의 CI 대기시간 보호.
on:
  pull_request:
    paths:
      - 'docs/plans/**'
      - 'scripts/gen_plans_index.py'
      - 'scripts/gen-plans-index.sh'
      - 'scripts/test_gen_plans_index.py'
      - 'scripts/check-plans-links.sh'
      - '.github/workflows/docs-plans-index.yml'
      # 페어 참조는 저장소 어디서든 깨질 수 있다 — plans/ 밖의 .md 도 트리거에 넣는다
      - '**/*.md'
  push:
    branches: [main]
    paths:
      - 'docs/plans/**'
      - 'scripts/gen_plans_index.py'
      - 'scripts/gen-plans-index.sh'
      - 'scripts/test_gen_plans_index.py'
      - 'scripts/check-plans-links.sh'
      - '.github/workflows/docs-plans-index.yml'
      # 페어 참조는 저장소 어디서든 깨질 수 있다 — plans/ 밖의 .md 도 트리거에 넣는다
      - '**/*.md'

jobs:
  check-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML + pytest
        # pytest 버전은 backend/requirements-dev.txt 와 일치시킨다(저장소 내 단일 버전).
        run: pip install 'PyYAML==6.0.3' 'pytest==9.1.1'

      - name: Run unit tests (parser/validator/renderer)
        run: python -m pytest scripts/test_gen_plans_index.py -v

      - name: Check INDEX drift
        run: bash scripts/gen-plans-index.sh --check

      - name: Shipped 페어 잔존 가드 (hybrid 컨벤션 — 2026-05-29 plans-ledger-restructure)
        run: |
          shipped_found=0
          # docs/plans/ 루트의 *.md 만 scan (logs/ + _templates/ 제외, README 제외)
          for f in docs/plans/*.md; do
            base=$(basename "$f")
            if [ "$base" = "README.md" ]; then continue; fi
            if grep -q "^status: shipped$" "$f" 2>/dev/null; then
              topic=$(grep '^ledger_topic:' "$f" | awk '{print $2}' || echo "process-infra")
              echo "::error file=$f::shipped frontmatter 페어가 docs/plans/ 루트에 남아있습니다."
              echo "→ docs/plans/logs/${topic}.md 의 Recent 섹션에 entry 추가 후 git rm 하세요."
              echo "→ 컨벤션: docs/plans/README.md 워크플로 섹션"
              shipped_found=1
            fi
          done
          if [ $shipped_found -eq 1 ]; then exit 1; fi

      - name: 페어 참조 링크 가드 (ledger 이관 시 dead link 방지)
        # 이관 컨벤션은 "ledger entry 추가 + 페어 git rm" 까지만 정하고, 그 페어를
        # 참조하던 다른 문서는 아무도 고치지 않는다 → 링크가 조용히 죽는다.
        # 실측 2026-09-01: 도입 시점에 10개 파일 26건이 이미 끊겨 있었다.
        run: bash scripts/check-plans-links.sh
