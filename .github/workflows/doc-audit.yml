name: doc-audit

# 문서 드리프트 감사 — canonical 코드/인프라 값 ↔ 문서 서술 일관성을 점검한다.
# 도구: scripts/agents/doc_audit.py (100% 결정론적 린터, 외부 AI 의존성 없음, 비용 $0).
# 검사 대상 문서: CLAUDE.md, README.md, docs/ops/operations-snapshot.md, docs/TRD.md, docs/PRD.md, docs/CHANGELOG.md
#
# 트리거:
#   - PR 및 main 브랜치 push: scripts/agents/**, doc-audit.yml, 주요 문서 변경 시 자동 검증.
#   - schedule: 매주 월요일 00:00 UTC = 09:00 KST (정기 무결성 점검).
#   - workflow_dispatch: 수동 즉시 실행 지원.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'  # 매주 월요일 00:00 UTC = 09:00 KST
  push:
    branches: [main]
    paths:
      - 'scripts/agents/**'
      - '.github/workflows/doc-audit.yml'
      - 'version.properties'
      - 'gradle/libs.versions.toml'
      - 'backend/requirements.in'
      - 'backend/requirements-dev.in'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/ops/operations-snapshot.md'
      - 'docs/TRD.md'
      - 'docs/PRD.md'
      - 'docs/SPEC.md'
      - 'docs/CHANGELOG.md'
      - 'docs/conventions/versioning.md'
      - 'backend/app/config.py'
      - 'backend/containerapp.yaml'
      - 'backend/docker-compose.yml'
      - 'backend/app/routers/**'
  pull_request:
    paths:
      - 'scripts/agents/**'
      - '.github/workflows/doc-audit.yml'
      - 'version.properties'
      - 'gradle/libs.versions.toml'
      - 'backend/requirements.in'
      - 'backend/requirements-dev.in'
      - 'CLAUDE.md'
      - 'README.md'
      - 'docs/ops/operations-snapshot.md'
      - 'docs/TRD.md'
      - 'docs/PRD.md'
      - 'docs/SPEC.md'
      - 'docs/CHANGELOG.md'
      - 'docs/conventions/versioning.md'
      - 'backend/app/config.py'
      - 'backend/containerapp.yaml'
      - 'backend/docker-compose.yml'
      - 'backend/app/routers/**'

permissions:
  contents: read

jobs:
  doc-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'

      - name: Install pytest
        # scripts/ 테스트는 백엔드 의존성 없이 표준 라이브러리만 검증하므로 pytest 만 설치한다.
        # 버전은 backend/requirements-dev.in 의 pytest== 핀을 단일 진실 공급원(SSoT)으로 읽어 설치한다.
        run: |
          PYTEST_SPEC="$(grep -E '^pytest==' backend/requirements-dev.in)"
          pip install "${PYTEST_SPEC}"

      - name: Unit tests (collector & audit rules)
        run: python -m pytest scripts/agents/test_doc_audit.py -v

      - name: Run documentation audit
        run: |
          set -o pipefail
          python scripts/agents/doc_audit.py --strict | tee audit-report.txt
          {
            echo '## 📄 문서 일관성 감사 리포트 (Deterministic Document Audit)'
            echo ''
            echo '```'
            cat audit-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '드리프트 [1-9]' audit-report.txt; then
            echo "::warning::문서 드리프트가 감지되었습니다 — Step Summary 를 확인하세요."
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: doc-audit-report
          path: audit-report.txt
          if-no-files-found: ignore
