name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend-fastapi/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend-fastapi/**'
      - '.github/workflows/backend.yml'

env:
  ACR_NAME: eundunhealthacr
  CONTAINER_APP_NAME: eundunhealth-api
  RESOURCE_GROUP: apps
  IMAGE_NAME: eundunhealth-api
  BACKEND_DIR: backend-fastapi

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/
        continue-on-error: true  # 초기에는 경고만 — strict 모드 정착 시 제거

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Build & Push image
        run: |
          TAG="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::7}"
          LATEST="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"
          docker build -t "$TAG" -t "$LATEST" .
          docker push "$TAG"
          docker push "$LATEST"

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::7}" \
            --set-env-vars \
              "DATABASE_URL=secretref:database-url" \
              "SUPABASE_URL=secretref:supabase-url" \
              "SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key" \
              "SENTRY_DSN=secretref:sentry-dsn-backend" \
              "ENVIRONMENT=production"

      - name: Health check
        run: |
          sleep 10
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Probing https://${FQDN}/health"
          for i in 1 2 3 4 5; do
            if curl -sf "https://${FQDN}/health"; then
              echo "OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1
