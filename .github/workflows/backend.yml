name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  ACR_NAME: eundunhealthacr
  CONTAINER_APP_NAME: eundunhealth-api
  RESOURCE_GROUP: apps
  IMAGE_NAME: eundunhealth-api
  BACKEND_DIR: backend

jobs:
  test:
    name: Lint, Type, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy strict)
        run: mypy app/

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ env.BACKEND_DIR }}/coverage.xml
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks가 전체 히스토리 검사

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-dev.txt

      - name: Install scan tools
        run: pip install pip-audit==2.7.3 bandit==1.8.0

      - name: pip-audit (의존성 CVE)
        # PYSEC-2026-161: starlette 1.0.1 fix이지만 FastAPI 0.136이 아직 1.0을 지원하지 않음.
        # FastAPI가 starlette 1.0을 지원하면 ignore 제거.
        run: |
          pip-audit -r ${{ env.BACKEND_DIR }}/requirements.txt --strict \
            --ignore-vuln PYSEC-2026-161

      - name: bandit (정적 보안 분석)
        run: bandit -r ${{ env.BACKEND_DIR }}/app -ll

      - name: gitleaks (시크릿 검출)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name $ACR_NAME

      - name: Build image
        run: |
          TAG="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${GITHUB_SHA::7}"
          LATEST="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:latest"
          docker build -t "$TAG" -t "$LATEST" .
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$LATEST" >> $GITHUB_ENV

      - name: Trivy 이미지 스캔 (CRITICAL/HIGH 차단)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

      - name: Push image (스캔 통과 후)
        run: |
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_TAG" \
            --set-env-vars \
              "DATABASE_URL=secretref:database-url" \
              "SUPABASE_URL=secretref:supabase-url" \
              "SUPABASE_SERVICE_ROLE_KEY=secretref:supabase-service-role-key" \
              "SENTRY_DSN=secretref:sentry-dsn-backend" \
              "ENVIRONMENT=production"

      - name: Health check
        run: |
          sleep 10
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Probing https://${FQDN}/health"
          for i in 1 2 3 4 5; do
            if curl -sf "https://${FQDN}/health"; then
              echo "OK"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1
